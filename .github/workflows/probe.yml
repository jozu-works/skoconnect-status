name: Probe and update status

on:
  # Scheduled probe moved to a local systemd timer on atlas-optiplex-3090 (2026-11-25):
  # the every-15-min hosted run consumed ~2,300 Actions-minutes/month, exhausting the
  # org's Free-plan 2,000-minute included quota and blocking ALL hosted Actions org-wide.
  # Re-enable ONLY if the org gains a paid Actions plan or a self-hosted runner targets this repo.
  # workflow_dispatch stays for manual hosted runs.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run probe
        run: python scripts/probe.py
      - name: Commit updated data
        if: always()  # data must land even if the probe step errored unexpectedly
        run: |
          git config user.name "status-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "probe: update status $(date -u +%FT%TZ)"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
